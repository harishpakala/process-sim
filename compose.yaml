# Local development stack. No production authentication or TLS is configured.
services:
  graphdb:
    image: ${GRAPHDB_IMAGE:-ontotext/graphdb:10.8.0}
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tep
      POSTGRES_PASSWORD: ${TEP_DB_PASSWORD:-tep-local-dev}
      POSTGRES_DB: tep_nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tep_timeseries:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tep -d tep_nexus"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "examples/run_opcua_server.py", "--endpoint", "opc.tcp://0.0.0.0:4841/process-sim/", "--seed", "42", "--real-time-factor", "1.0"]
    ports:
      - "127.0.0.1:4841:4841"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "process_sim.api.server"]
    environment:
      PROCESS_SIM_API_HOST: 0.0.0.0
      PROCESS_SIM_API_PORT: "8000"
      GRAPHDB_SPARQL_ENDPOINT: http://graphdb:7200/repositories/AAST
      TEP_TIMESCALE_DSN: postgresql://tep:${TEP_DB_PASSWORD:-tep-local-dev}@timescaledb:5432/tep_nexus
      TEP_OPCUA_ENDPOINT: opc.tcp://simulator:4841/process-sim/
    depends_on:
      timescaledb:
        condition: service_healthy
      graphdb:
        condition: service_started
      simulator:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      PROCESS_SIM_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

volumes:
  graphdb_data:
  tep_timeseries:
