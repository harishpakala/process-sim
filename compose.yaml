# Local development stack. No production authentication or TLS is configured.
services:
  graphdb:
    image: ${GRAPHDB_IMAGE:-ontotext/graphdb:10.8.0}
    ports:
      - "127.0.0.1:7201:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
    restart: unless-stopped

  graphdb-init:
    image: curlimages/curl:8.11.1
    depends_on:
      graphdb:
        condition: service_started
    volumes:
      - ./docker/graphdb/AAST.ttl:/config/AAST.ttl:ro
      - ./docker/graphdb/init.sh:/config/init.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tr -d '\015' < /config/init.sh > /tmp/graphdb-init.sh
        exec /bin/sh /tmp/graphdb-init.sh
    restart: "no"

  semantic-lift:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command:
      - /bin/sh
      - -ec
      - |
        python -m semantic.template_lifting --push
        python -m semantic.instance_lifting --validate --push
    environment:
      GRAPHDB_STATEMENTS_ENDPOINT: http://graphdb:7200/repositories/AAST/statements
    depends_on:
      graphdb-init:
        condition: service_completed_successfully
    volumes:
      - semantic_outputs:/app/semantic/ontology2
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tep
      POSTGRES_PASSWORD: ${TEP_DB_PASSWORD:-1234}
      POSTGRES_DB: tep_nexus
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tep_timeseries:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tep -d tep_nexus"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "examples/run_opcua_server.py", "--endpoint", "opc.tcp://0.0.0.0:4841/process-sim/", "--seed", "42", "--real-time-factor", "1.0"]
    ports:
      - "127.0.0.1:4841:4841"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "process_sim.api.server"]
    environment:
      PROCESS_SIM_API_HOST: 0.0.0.0
      PROCESS_SIM_API_PORT: "8001"
      GRAPHDB_SPARQL_ENDPOINT: http://graphdb:7200/repositories/AAST
      TEP_TIMESCALE_DSN: postgresql://tep:${TEP_DB_PASSWORD:-1234}@timescaledb:5432/tep_nexus
      TEP_OPCUA_ENDPOINT: opc.tcp://simulator:4841/process-sim/
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      timescaledb:
        condition: service_healthy
      semantic-lift:
        condition: service_completed_successfully
      simulator:
        condition: service_started
    volumes:
      - semantic_outputs:/app/semantic/ontology2:ro
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      PROCESS_SIM_API_URL: http://api:8001
    depends_on:
      - api
    ports:
      - "127.0.0.1:5176:5173"
    restart: unless-stopped

volumes:
  graphdb_data:
  tep_timeseries:
  semantic_outputs:
