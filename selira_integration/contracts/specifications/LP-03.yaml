id: LP-03
name: Change Impact Assessment
type: lifecycle_policy
status: behavioral_specification_candidate
specification: ../safsl/LP-03.safsl
grammar: process.lark
implementation: process_sim.selira.reassessment.multi_contract.compare
scope: union of previous and candidate contract-focus pairs
inputs:
  CoverageAttested: caller dependency coverage attestation
  PolicyUnchanged: caller policy stability attestation
  AuthorityUnchanged: caller authority stability attestation
  AssignmentChanged: old and new projected assignments differ, including scope entry or exit
  PreviousLookupChanged: previous identifier lookup target set changed
  CandidateLookupChanged: candidate identifier lookup target set changed
output: Affected
fallback: select every pair if any reuse attestation is false
notes: Host supplies projected inputs. SAFSL describes the per-pair decision, not graph projection. Python remains the executable realization.
