[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selira-research"
version = "0.1.0.dev0"
requires-python = ">=3.10"
dependencies = ["lark", "rdflib", "pyshacl"]

[project.optional-dependencies]
test = ["pytest"]
service = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["selira*"]

[tool.setuptools.package-data]
"selira.language" = ["grammar/*.lark", "PORTING.md"]
