name: Apply Python provenance headers (one-time)

on:
  push:
    branches:
      - refactor/repository-cleanup
    paths:
      - '.github/workflows/apply-python-headers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate headers from Git creation history
        run: python scripts/add_python_file_headers.py
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('.').rglob('*.py'):
              if any(x in p.parts for x in ('.git', '.venv', 'node_modules')):
                  continue
              ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          PY
      - name: Commit results and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-python-headers.yml
          git add -A -- '*.py' '.github/workflows/apply-python-headers.yml'
          if ! git diff --cached --quiet; then
            git commit -m "docs: apply original Git creation dates and Harish attribution to Python files"
            git push origin HEAD:refactor/repository-cleanup
          fi
