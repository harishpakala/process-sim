name: SELiRA formal and lifecycle tests

on:
  push:
    branches:
      - feature/selira-12-contracts-graphdb-prototype
    paths:
      - 'selira_integration/**'
      - 'tests/test_selira_*.py'
      - '.github/workflows/selira-formal-tests.yml'
  pull_request:
    paths:
      - 'selira_integration/**'
      - 'tests/test_selira_*.py'
      - '.github/workflows/selira-formal-tests.yml'
  workflow_dispatch:

jobs:
  formal-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free formal tests
        run: |
          python -m unittest -v \
            tests.test_selira_contract_composition \
            tests.test_selira_contract_dependency \
            tests.test_selira_state_machine \
            tests.test_selira_sc01_f6_integration
