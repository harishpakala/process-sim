name: SELiRA unit tests

on:
  pull_request:
    paths:
      - 'src/process_sim/selira/**'
      - 'tests/test_selira_*.py'
      - '.github/workflows/selira-tests.yml'
  push:
    branches:
      - feature/selira-correspondence-resolution
    paths:
      - 'src/process_sim/selira/**'
      - 'tests/test_selira_*.py'
      - '.github/workflows/selira-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated SELiRA tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_selira_*.py' -v
